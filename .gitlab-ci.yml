stages:
  - test

test:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache python3 py3-pip docker-compose
    - cd docker
    - docker compose --env-file dev.env -f docker-compose.yml -f docker-compose.dev.yml up -d --build
    - cd ../tests
    - pip install -r requirements.txt --break-system-packages
  script:
    - ./run_tests.py backend
  after_script:
    - cd docker
    - docker compose --env-file dev.env -f docker-compose.yml -f docker-compose.dev.yml down --volumes
